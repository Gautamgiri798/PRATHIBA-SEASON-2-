services:
  postgres:
    image: postgres:16-alpine
    container_name: pratibha-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=pratibha_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  voting-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pratibha-voting-system
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_PASSCODE=admin123
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/pratibha_db
    depends_on:
      - postgres
    restart: always

volumes:
  postgres-data:
    driver: local
